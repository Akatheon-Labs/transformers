---
name: CodeQL Security Analysis

on:
  workflow_dispatch: {}  # off on this showcase fork: upstream's CI runs upstream

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    uses: huggingface/security-workflows/.github/workflows/codeql-reusable.yml@a2b4c9b1d4f9afbb9f24b80ae7e4382f5bb51a68  # main
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    with:
      languages: '["actions"]'
      queries: 'security-extended,security-and-quality'
      runner: 'ubuntu-latest'
