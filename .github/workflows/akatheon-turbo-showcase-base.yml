# Akatheon Turbo showcase on a fork of Hugging Face transformers: the base branch's side. Akatheon Turbo records one
# certificate per test of the slice (see akatheon-turbo-showcase.yml for the slice and the pull requests' four jobs), in
# 16 parts merged into one, and pytest-testmon builds its database from one full run; both are saved in GitHub's cache
# under the base commit, where the pull requests' jobs read them. Runs on a push to akatheon-showcase, or by hand;
# akatheon-turbo-showcase-keepwarm.yml starts it when GitHub's cache no longer holds them.
# Every job is offline: the Hugging Face files these tests read come from this fork's release, never the Hub.
name: akatheon-turbo-showcase-base
on:
  push:
    branches: [akatheon-showcase]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akatheon-base-${{ github.ref }}
  cancel-in-progress: false  # never cancel a recording half way
env:
