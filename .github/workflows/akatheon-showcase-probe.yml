# Scratch (branch akatheon-probe, never a pull request): does the planted demo bug fail the tests that read it? The
# tests that looked up hf-internal-testing/tiny-random-LlamaForCausalLM in the base certificates, run without and with a
# folder of that name holding a config.json and a tokenizer_config.json (what save_pretrained(model_id) leaves behind).
name: akatheon-showcase-probe
on:
  push:
    branches: [akatheon-probe]
permissions:
  contents: read
env:
  HF_HUB_OFFLINE: "1"
  HF_ASSETS_URL: https://github.com/akatheon-labs/transformers/releases/download/showcase-hf-assets-v3/hf-assets-v3.tar.gz.enc
  HF_ASSETS_SHA256: e8755f085fb7967874ee725f385f5ea993463d01d79eea05dbe74b180e8be44f
  TESTS: >-
    tests/trainer/test_trainer.py::TrainerIntegrationTest::test_special_token_alignment
    tests/trainer/test_trainer.py::TrainerIntegrationTest::test_special_token_alignment_composite_config
    tests/trainer/test_trainer.py::TrainerIntegrationTest::test_special_token_alignment_keeps_the_eos_ids_the_config_declares
    tests/trainer/test_trainer.py::TrainerIntegrationTest::test_special_token_alignment_keeps_tokens_the_tokenizer_does_not_define
    tests/trainer/test_trainer.py::TrainerIntegrationTest::test_trainer_works_without_model_config
    tests/trainer/test_trainer_evaluation.py::TrainerEvaluationTest::test_train_and_predict_loss_parity
    tests/utils/test_configuration_utils.py::ConfigTestUtils::test_get_text_config
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv -q --python 3.12 .venv
          uv pip install -q --python .venv/bin/python -r .github/akatheon-showcase/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          uv pip install -q --python .venv/bin/python --no-deps -e .
      - name: Hugging Face files (this fork's release, never the Hub)
        env:
          HF_ASSETS_KEY: ${{ secrets.HF_ASSETS_KEY }}
        run: |
          for p in 0 1; do curl -sSfL --retry 3 "$HF_ASSETS_URL.part$p"; done > "$RUNNER_TEMP/hf.enc"
          echo "$HF_ASSETS_SHA256  $RUNNER_TEMP/hf.enc" | sha256sum -c -
          mkdir -p ~/.cache/huggingface
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HF_ASSETS_KEY -in "$RUNNER_TEMP/hf.enc" | tar -xz -C ~/.cache/huggingface
          rm "$RUNNER_TEMP/hf.enc"
      - name: Without the folder, then with it
        run: |
          set +e
          .venv/bin/python -m pytest -p no:cacheprovider -p no:testmon -q -rA $TESTS > without.txt 2>&1; echo "without the folder: exit $?"; tail -3 without.txt
          mkdir -p hf-internal-testing/tiny-random-LlamaForCausalLM
          printf '{\n  "architectures": ["LlamaForCausalLM"],\n  "model_type": "llama",\n  "vocab_size": 32000,\n  "hidden_size": 16,\n  "intermediate_size": 64,\n  "num_hidden_layers": 2,\n  "num_attention_heads": 4,\n  "num_key_value_heads": 4,\n  "max_position_embeddings": 2048,\n  "bos_token_id": 0,\n  "eos_token_id": 1,\n  "pad_token_id": -1\n}\n' > hf-internal-testing/tiny-random-LlamaForCausalLM/config.json
          printf '{\n  "tokenizer_class": "LlamaTokenizer",\n  "bos_token": "<s>",\n  "eos_token": "</s>",\n  "unk_token": "<unk>",\n  "model_max_length": 2048\n}\n' > hf-internal-testing/tiny-random-LlamaForCausalLM/tokenizer_config.json
          .venv/bin/python -m pytest -p no:cacheprovider -p no:testmon -q -rA $TESTS > with.txt 2>&1; echo "with the folder: exit $?"; grep -E "^(PASSED|FAILED|ERROR) " with.txt | cut -c1-220; tail -3 with.txt
          { echo "### probe"; echo; echo '```'; grep -E "^(PASSED|FAILED|ERROR) " without.txt | cut -c1-160; echo "--- with the folder"; grep -E "^(PASSED|FAILED|ERROR) " with.txt | cut -c1-200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
