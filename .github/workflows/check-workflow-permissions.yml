---
name: Check Permissions Advisor

on:
  workflow_dispatch: {}  # off on this showcase fork: upstream's CI runs upstream

permissions:
  contents: read

jobs:
  advisor:
    uses: huggingface/security-workflows/.github/workflows/permissions-advisor-reusable.yml@a2b4c9b1d4f9afbb9f24b80ae7e4382f5bb51a68  # main
    permissions:
      actions: read
      contents: read
    with:
      workflow_name: ${{ inputs.workflow_name }}
      run_count: ${{ fromJSON(inputs.run_count) }}